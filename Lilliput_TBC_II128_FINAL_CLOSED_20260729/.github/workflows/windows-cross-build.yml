name: Windows cross-build

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'tools/**'
      - 'presentation/**'
      - 'scripts/build_windows_from_wsl.sh'
      - 'Makefile'

jobs:
  mingw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64 file
      - run: make windows-rebuild
      - uses: actions/upload-artifact@v4
        with:
          name: windows-executables
          path: |
            bin/windows/*.exe
            PROJECT_OVERVIEW.exe
            RUN_ALL_TESTS.exe
            RUN_ALL_SCENARIOS.exe
            RUN_FULL_PRESENTATION.exe
