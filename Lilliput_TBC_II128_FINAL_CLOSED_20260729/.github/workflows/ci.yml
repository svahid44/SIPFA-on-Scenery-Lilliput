name: C build and tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        compiler: [gcc, clang]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.compiler }}
      - name: Build and test
        run: make CC=${{ matrix.compiler }} CFLAGS='-std=c99 -O2 -Wall -Wextra -Wpedantic -Wshadow -Wconversion -Werror' test
