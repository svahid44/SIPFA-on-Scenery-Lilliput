name: Reproducibility or implementation issue
description: Report a build, test, dataset, or scientific-reproducibility problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include real secret keys or confidential hardware data."
  - type: input
    id: platform
    attributes:
      label: Platform and compiler
      placeholder: "Ubuntu 24.04, GCC 14.2"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command
      render: shell
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
