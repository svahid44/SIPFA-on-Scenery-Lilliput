name: C99 build and tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  make:
    name: Make / ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
          - compiler: clang
            cc: clang
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make clean && make CC=${{ matrix.cc }} all
      - name: Test
        run: make CC=${{ matrix.cc }} test

  cmake:
    name: CMake / CTest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-cmake --parallel
      - name: Test
        run: ctest --test-dir build-cmake --output-on-failure
